<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="%BRAND_NAME% Season %BRAND_SEASON% — live scores, fixtures, results, points table and statistics." />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/%BRAND_LOGO%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>%BRAND_NAME% %BRAND_YEAR%</title>
    <link rel="stylesheet" href="/boot.css" />
  </head>
  <body>
    <!-- Launch loader: shown on app launch only (removed by src/lib/boot.js), never on navigation. -->
    <div id="boot" role="status" aria-label="Loading %BRAND_NAME%" style="background: %BRAND_LAUNCH_BG%">
      <img class="boot-logo" src="/%BRAND_LOGO%" alt="" width="176" height="176" />
      <p class="boot-name">%BRAND_NAME%</p>
      <p class="boot-season">Season %BRAND_SEASON%</p>
      <div class="boot-bar"><span></span></div>
      <p class="boot-credit">%BRAND_CREDIT%</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
