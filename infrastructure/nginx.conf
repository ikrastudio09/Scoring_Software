# /etc/nginx/sites-available/cricket  — TLS via certbot (see docs/DEPLOYMENT.md)
upstream cricket_node {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name scores.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name scores.example.com;

    ssl_certificate     /etc/letsencrypt/live/scores.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scores.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Android App Links verification file (optional, see docs/ANDROID.md)
    location = /.well-known/assetlinks.json { root /var/www/cricket; default_type application/json; }

    # Socket.IO: WebSocket upgrade and long timeouts
    location /socket.io/ {
        proxy_pass http://cricket_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://cricket_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
